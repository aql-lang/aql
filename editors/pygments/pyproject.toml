[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boru-pygments-lexer"
version = "0.1.0"
description = "Pygments lexer for boru, a concatenative, strongly-typed query language."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "boru contributors" }]
keywords = ["pygments", "lexer", "boru", "syntax highlighting"]
dependencies = ["Pygments>=2.0"]

[project.urls]
Homepage = "https://github.com/boru-lang/boru"
Source = "https://github.com/boru-lang/boru/tree/main/editors/pygments"

# The entry point Pygments (and Chroma's bridge, and mkdocs/Sphinx) discover:
# `pygmentize -l boru` works once this package is installed.
[project.entry-points."pygments.lexers"]
boru = "boru_lexer:BoruLexer"

[tool.setuptools]
py-modules = ["boru_lexer"]

# BORU Language Server for Helix.
#
# Merge the blocks below into ~/.config/helix/languages.toml.
# Helix talks to language servers over stdio by default; the
# [language-server.boru] block tells it how to spawn `boru lsp` and
# the [[language]] block binds the server to *.boru files.

[language-server.boru]
command = "boru"
args = ["lsp"]

[[language]]
name = "boru"
scope = "source.boru"
file-types = ["boru"]
comment-token = "#"
roots = ["boru.jsonic", ".git"]
language-servers = ["boru"]
auto-format = false

# Uncomment to format on save via the LSP formatting capability.
# [language.formatter]
# command = "boru"
# args = ["fmt", "-"]

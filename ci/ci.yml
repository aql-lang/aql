name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: lang/go/go.mod

      - name: Install golangci-lint
        # Use `go install` (Go is already on PATH from setup-go) rather
        # than the official action: `make lint` invokes the binary
        # directly so we just need it on PATH. The action insists on
        # running `golangci-lint run` itself, which we don't want here
        # — we run it ourselves later, against every module.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build CLI
        run: make -C cmd/go build

      - name: Vet (all modules)
        run: make vet

      - name: Lint assertions
        run: make -C lang/go lint-assertions

      - name: Lint (golangci-lint, all modules)
        run: make lint

      - name: Test (all modules)
        run: make test

      # ADR-008: 100% unit-test coverage of every reachable Go statement
      # across the merged cross-suite profile, the sole exclusion being the
      # reviewed allowlist of provably-unreachable defensive guards
      # (test/go/covergate/allowlist.tsv). Enforced here so the allowlist
      # can't silently drift as line numbers shift — the exact failure mode
      # that went unnoticed across the #236–#248 merge batch because no CI
      # step ran the gate (design/COVERAGE-ALLOWLIST.10.md).
      - name: Cover gate (ADR-008)
        run: make cover-gate

      # The project knowledge graph (kg/) must stay in sync with the
      # sources that generate it: type-check the BORU pipeline, run its
      # test suite, rebuild the bundle, and fail if the committed
      # kg/out/graph.json or kg/out/graph.sql drifts from the rebuild —
      # the "keep the graph updated with each PR" rule, enforced. The
      # build is deterministic, so an in-sync graph diffs empty.
      - name: Knowledge graph (check, test, freshness)
        run: |
          make -C kg check
          make -C kg test
          make -C kg graph
          git diff --exit-code kg/out

      # The bytecode compiler's correctness gates (differential,
      # whole-corpus parity, combination matrix, alloc ceilings) run as
      # part of `make test`. The race-detector gates do not, so run them
      # explicitly: a shared immutable Program driven across forks, the
      # island sub-engine reuse, and the concurrent spec rows in compiled
      # mode must be data-race-free.
      - name: Bytecode race gates
        run: |
          ( cd lang/go && go test . -run 'TestCompiledConcurrencyRaceFree|TestCompiledIslandReuseNoStateLeak' -race )
          ( cd test/go && go test ./langspec/ -run 'TestSpecCompiledConcurrentRowsRaceFree' -race )

      # The VM's hot path reuses one args buffer per run (eng/go/vm.go),
      # sound only while no compiled-reachable native retains its args slice.
      # -tags borudebug flips that buffer to a fresh allocation per call
      # (eng/go/vm_args_debug.go), so a retaining handler that would silently
      # corrupt a later dispatch in the release build instead diverges cleanly
      # here. Run the differential + combination + whole-corpus parity gates
      # under the tag so the invariant is guarded as compiled coverage grows.
      - name: Bytecode args-aliasing gate (borudebug)
        run: |
          ( cd lang/go && go test -tags borudebug . -run 'Bytecode|Compiled|Emit' )
          ( cd test/go && go test -tags borudebug ./langspec/ -run 'TestSpecCompiledDifferential|TestSpecCompiledOrFallback|TestCompiledCombinationParity' )

      - name: Build WASM
        run: make -C wpg wasm

      # Advisory: govulncheck currently flags Go standard-library vulns
      # that are fixed in newer 1.24.x patch releases — see
      # STATIC_ANALYSIS_REPORT.md. Drop continue-on-error once the `go`
      # directive is bumped (or CI installs the latest 1.24.x toolchain).
      - name: Vulncheck (advisory, all modules)
        run: make vuln
        continue-on-error: true
